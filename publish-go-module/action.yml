name: "narwhl - Publish Go Module"
description: "Packs the Go module named by a release tag (go/<name>/vX.Y.Z) and publishes it to pkg.narwhl.dev, authorized by the job's GitHub OIDC token."
author: "narwhl"

inputs:
  tag:
    description: "Release tag, <module directory>/<version>, e.g. go/authz/v0.1.0. Defaults to the pushed tag."
    required: false
    default: ""
  path:
    description: "Path to the checkout holding the tag, relative to the workspace. Defaults to the workspace."
    required: false
    default: "."
  host:
    description: "Host part of the module paths."
    required: false
    default: "pkg.narwhl.dev"
  source-dir:
    description: "Directory of the repository that holds the Go modules. Module paths are <host>/<directory below it>: go/authz is pkg.narwhl.dev/authz."
    required: false
    default: "go"
  proxy:
    description: "Module proxy to publish to. Defaults to https://<host>."
    required: false
    default: ""
  mirror:
    description: "Public mirror to warm after publishing, so sum.golang.org and pkg.go.dev see the version now. Empty to skip."
    required: false
    default: "https://proxy.golang.org"
  out:
    description: "Write the version into this directory as a GOPROXY tree instead of publishing it, e.g. for a dry run. Relative to the workspace."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Pack, publish and verify
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_SOURCE_DIR: ${{ inputs.source-dir }}
        INPUT_PROXY: ${{ inputs.proxy }}
        INPUT_MIRROR: ${{ inputs.mirror }}
        INPUT_OUT: ${{ inputs.out }}
        # Build this tool on its own, whatever the caller's workspace sets.
        GOWORK: "off"
        GOFLAGS: ""
      run: |
        # The tool runs from the action's directory, so resolve paths against the workspace.
        abs() { case "$1" in /*) printf '%s' "$1" ;; *) printf '%s/%s' "$GITHUB_WORKSPACE" "$1" ;; esac; }
        args=(-repo "$(abs "$INPUT_PATH")" -host "$INPUT_HOST" -source-dir "$INPUT_SOURCE_DIR" -mirror "$INPUT_MIRROR")
        if [[ -n "$INPUT_TAG" ]]; then args+=(-tag "$INPUT_TAG"); fi
        if [[ -n "$INPUT_PROXY" ]]; then args+=(-proxy "$INPUT_PROXY"); fi
        if [[ -n "$INPUT_OUT" ]]; then args+=(-out "$(abs "$INPUT_OUT")"); fi
        go run . "${args[@]}"

branding:
  icon: "package"
  color: "purple"
